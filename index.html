here<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodafone Cards - OROR</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="login-card">
            <!-- الشعار -->
            <div class="logo-container">
                <div class="logo-text">OROR</div>
                <div class="sub-logo">Ramadan Cards</div>
            </div>
            
            <!-- صورة فودافون -->
            <div class="vodafone-logo">
                <i class="fas fa-sim-card"></i>
                <span>Vodafone Cards</span>
            </div>
            
            <!-- اسم المستخدم -->
            <div class="user-name">MARAWAN</div>
            
            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="phone">رقم الهاتف</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" value="01021520331" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" value="Aoror12007716@#" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                </div>
                
                <button type="submit" class="login-btn">
                    <span>دخول</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
                
                <div class="security-note">
                    <i class="fas fa-shield-alt"></i>
                    <span>بيانات أمنة ومشفرة</span>
                </div>
            </form>
            
            <!-- حقوق التطوير -->
            <div class="developer-credit">
                <span>تم التطوير بواسطة <strong>OROR</strong></span>
            </div>
        </div>
    </div>
    
    <!-- رسائل التنبيه -->
    <div id="toast" class="toast"></div>
    
    <script src="script.js"></script>
</body>
</html>
